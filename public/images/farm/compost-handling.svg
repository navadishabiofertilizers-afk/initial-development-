<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24381e" />
      <stop offset="60%" stop-color="#182914" />
      <stop offset="100%" stop-color="#0f1a0d" />
    </linearGradient>
    <linearGradient id="sieveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8c5e3c" />
      <stop offset="50%" stop-color="#b07d56" />
      <stop offset="100%" stop-color="#704829" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgH)" />
  <circle cx="200" cy="150" r="120" fill="#52b788" opacity="0.06" />

  <!-- Farm background shed roof line -->
  <polygon points="50,160 400,90 750,160 750,190 400,120 50,190" fill="#3a5a40" opacity="0.4" />
  <rect x="100" y="190" width="16" height="350" fill="#2d4a22" opacity="0.5" />
  <rect x="680" y="190" width="16" height="350" fill="#2d4a22" opacity="0.5" />

  <!-- Sieve / Screening Frame -->
  <g transform="rotate(-12 380 320)">
    <rect x="220" y="240" width="360" height="20" rx="4" fill="url(#sieveGrad)" />
    <rect x="220" y="380" width="360" height="20" rx="4" fill="url(#sieveGrad)" />
    <rect x="220" y="240" width="20" height="160" rx="4" fill="url(#sieveGrad)" />
    <rect x="560" y="240" width="20" height="160" rx="4" fill="url(#sieveGrad)" />
    <!-- Mesh pattern -->
    <path d="M 240 270 L 560 270 M 240 300 L 560 300 M 240 330 L 560 330 M 240 360 L 560 360" stroke="#d4a373" stroke-width="2" opacity="0.6" />
    <path d="M 270 240 L 270 400 M 310 240 L 310 400 M 350 240 L 350 400 M 390 240 L 390 400 M 430 240 L 430 400 M 470 240 L 470 400 M 510 240 L 510 400" stroke="#d4a373" stroke-width="2" opacity="0.6" />
  </g>

  <!-- Organic Compost Mound on Floor -->
  <path d="M 120 540 Q 400 370 680 540 Z" fill="#2c1a0e" />
  <path d="M 200 540 Q 400 410 600 540 Z" fill="#3d2616" />

  <!-- Falling Fine Vermicompost Particles -->
  <g fill="#432818" opacity="0.9">
    <circle cx="360" cy="400" r="3.5" /><circle cx="380" cy="410" r="4" /><circle cx="410" cy="390" r="3" />
    <circle cx="370" cy="430" r="4.5" /><circle cx="395" cy="425" r="3" /><circle cx="420" cy="440" r="5" />
    <circle cx="350" cy="450" r="4" /><circle cx="390" cy="460" r="4.5" /><circle cx="430" cy="470" r="3.5" />
    <circle cx="360" cy="480" r="5" /><circle cx="410" cy="485" r="4" /><circle cx="440" cy="495" r="3.5" />
  </g>

  <!-- Hand Tools (Scoop / Shovel contour) -->
  <path d="M 460 260 L 610 170" stroke="#c9936a" stroke-width="12" stroke-linecap="round" />
  <path d="M 430 270 L 480 240 L 495 285 L 440 310 Z" fill="#6c757d" stroke="#495057" stroke-width="2" />

  <!-- Info Overlay -->
  <rect x="50" y="490" width="700" height="75" rx="14" fill="#0f1c0ecc" stroke="#52b78844" stroke-width="1.5" />
  <circle cx="85" cy="527" r="18" fill="#40916c" />
  <path d="M 78 528 L 83 533 L 93 521" stroke="#d8f3dc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  
  <text x="120" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#ffffff">
    खत चाळणी व प्रक्रिया (Compost Handling &amp; Sieving)
  </text>
  <text x="120" y="545" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#a3b899">
    Nava Disha Bio Fertilizers • चाळलेले चहाच्या भुकटीसारखे गांडूळ खत • Jath Farm
  </text>
</svg>
